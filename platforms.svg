<svg width="620" height="400" viewBox="0 0 620 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="screenClip">
      <rect x="233" y="38" width="154" height="300" rx="12"/>
    </clipPath>
  </defs>

  <rect width="620" height="400" fill="transparent"/>

  <!-- ===== Beschriftung links: iOS ===== -->
  <g>
    <text x="150" y="180" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif"
          font-size="17" font-weight="500" letter-spacing="2.5" fill="#D9A441">
      iOS
      <animate attributeName="fill" values="#D9A441;#D9A441;#585858;#585858;#D9A441"
               keyTimes="0;0.45;0.52;0.95;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="150" y="204" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif"
          font-size="12" letter-spacing="1.5" fill="#8f8f8f">
      Swift · SwiftUI
    </text>
  </g>

  <!-- ===== Beschriftung rechts: Android ===== -->
  <g>
    <text x="480" y="180" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif"
          font-size="17" font-weight="500" letter-spacing="2.5" fill="#585858">
      Android
      <animate attributeName="fill" values="#585858;#585858;#D9A441;#D9A441;#585858"
               keyTimes="0;0.45;0.52;0.95;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="480" y="204" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif"
          font-size="12" letter-spacing="1.5" fill="#8f8f8f">
      Kotlin · Compose
    </text>
  </g>

  <!-- ===== Telefonrahmen ===== -->
  <rect x="225" y="30" width="170" height="316" rx="20" fill="none" stroke="#4f4f4f" stroke-width="2.5"/>
  <rect x="233" y="38" width="154" height="300" rx="12" fill="#141414"/>

  <!-- ===== Bildschirminhalt ===== -->
  <g clip-path="url(#screenClip)">

    <!-- iOS-Variante -->
    <g opacity="1">
      <animate attributeName="opacity" values="1;1;0;0;1"
               keyTimes="0;0.45;0.52;0.95;1" dur="8s" repeatCount="indefinite"/>

      <!-- Notch -->
      <rect x="285" y="42" width="50" height="8" rx="4" fill="#2a2a2a"/>

      <!-- Große Überschrift, typisch iOS -->
      <text x="247" y="84" font-family="Helvetica Neue, Arial, sans-serif"
            font-size="15" font-weight="700" fill="#e0e0e0">GreenBite</text>

      <!-- Score-Ring -->
      <circle cx="310" cy="140" r="30" fill="none" stroke="#2e2e2e" stroke-width="6"/>
      <circle cx="310" cy="140" r="30" fill="none" stroke="#D9A441" stroke-width="6"
              stroke-linecap="round" stroke-dasharray="188" stroke-dashoffset="188"
              transform="rotate(-90 310 140)">
        <animate attributeName="stroke-dashoffset" values="188;66;66;188"
                 keyTimes="0;0.18;0.45;0.5" dur="8s" repeatCount="indefinite"/>
      </circle>
      <text x="310" y="146" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif"
            font-size="16" font-weight="600" fill="#e0e0e0">72</text>

      <!-- Karten mit starker Rundung -->
      <rect x="247" y="192" width="126" height="34" rx="12" fill="#232323"/>
      <rect x="257" y="203" width="52" height="5" rx="2.5" fill="#6a6a6a"/>
      <rect x="257" y="213" width="34" height="4" rx="2" fill="#4a4a4a"/>
      <circle cx="358" cy="209" r="7" fill="#D9A441" opacity="0.85"/>

      <rect x="247" y="234" width="126" height="34" rx="12" fill="#232323"/>
      <rect x="257" y="245" width="60" height="5" rx="2.5" fill="#6a6a6a"/>
      <rect x="257" y="255" width="28" height="4" rx="2" fill="#4a4a4a"/>
      <circle cx="358" cy="251" r="7" fill="#5a5a5a"/>

      <!-- Tab Bar unten, iOS-Stil -->
      <line x1="233" y1="300" x2="387" y2="300" stroke="#2a2a2a" stroke-width="1"/>
      <circle cx="268" cy="316" r="5" fill="#D9A441"/>
      <circle cx="310" cy="316" r="5" fill="#4a4a4a"/>
      <circle cx="352" cy="316" r="5" fill="#4a4a4a"/>
      <rect x="290" y="330" width="40" height="3" rx="1.5" fill="#3a3a3a"/>
    </g>

    <!-- Android-Variante -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0"
               keyTimes="0;0.45;0.52;0.95;1" dur="8s" repeatCount="indefinite"/>

      <!-- Punch-Hole-Kamera -->
      <circle cx="310" cy="48" r="4" fill="#2a2a2a"/>

      <!-- Top App Bar, Material-Stil -->
      <rect x="233" y="58" width="154" height="30" fill="#1d1d1d"/>
      <text x="247" y="78" font-family="Roboto, Helvetica Neue, Arial, sans-serif"
            font-size="13" font-weight="500" fill="#e0e0e0">GreenBite</text>
      <circle cx="368" cy="70" r="1.6" fill="#8a8a8a"/>
      <circle cx="368" cy="75" r="1.6" fill="#8a8a8a"/>
      <circle cx="368" cy="65" r="1.6" fill="#8a8a8a"/>

      <!-- Score-Ring -->
      <circle cx="310" cy="146" r="30" fill="none" stroke="#2e2e2e" stroke-width="6"/>
      <circle cx="310" cy="146" r="30" fill="none" stroke="#D9A441" stroke-width="6"
              stroke-linecap="round" stroke-dasharray="188" stroke-dashoffset="188"
              transform="rotate(-90 310 146)">
        <animate attributeName="stroke-dashoffset" values="188;188;188;66;66;188"
                 keyTimes="0;0.45;0.52;0.68;0.95;1" dur="8s" repeatCount="indefinite"/>
      </circle>
      <text x="310" y="152" text-anchor="middle" font-family="Roboto, Helvetica Neue, Arial, sans-serif"
            font-size="16" font-weight="500" fill="#e0e0e0">72</text>

      <!-- Karten mit geringerer Rundung -->
      <rect x="247" y="196" width="126" height="34" rx="6" fill="#232323"/>
      <rect x="257" y="207" width="52" height="5" rx="1" fill="#6a6a6a"/>
      <rect x="257" y="217" width="34" height="4" rx="1" fill="#4a4a4a"/>
      <rect x="351" y="206" width="14" height="14" rx="3" fill="#D9A441" opacity="0.85"/>

      <rect x="247" y="238" width="126" height="34" rx="6" fill="#232323"/>
      <rect x="257" y="249" width="60" height="5" rx="1" fill="#6a6a6a"/>
      <rect x="257" y="259" width="28" height="4" rx="1" fill="#4a4a4a"/>
      <rect x="351" y="248" width="14" height="14" rx="3" fill="#5a5a5a"/>

      <!-- Floating Action Button -->
      <circle cx="360" cy="288" r="13" fill="#D9A441"/>
      <path d="M 360,282 L 360,294 M 354,288 L 366,288" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>

      <!-- Bottom Navigation mit Pill-Indikator -->
      <rect x="233" y="304" width="154" height="34" fill="#1d1d1d"/>
      <rect x="254" y="310" width="28" height="14" rx="7" fill="#D9A441" opacity="0.25"/>
      <circle cx="268" cy="317" r="4.5" fill="#D9A441"/>
      <circle cx="310" cy="317" r="4.5" fill="#5a5a5a"/>
      <circle cx="352" cy="317" r="4.5" fill="#5a5a5a"/>
    </g>
  </g>

  <!-- Bernstein-Punkt, wandert zwischen den beiden Seiten hin und her -->
  <circle cx="205" cy="192" r="3" fill="#D9A441">
    <animate attributeName="cx" values="205;205;415;415;205"
             keyTimes="0;0.45;0.52;0.95;1" dur="8s" repeatCount="indefinite"
             calcMode="spline" keySplines="0 0 1 1; .4 0 .2 1; 0 0 1 1; .4 0 .2 1"/>
  </circle>
</svg>
